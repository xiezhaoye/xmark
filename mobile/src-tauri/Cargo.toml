[package]
name = "xmark-mobile"
version = "0.1.0"
description = "XMark Mobile — read-only reader shell"
edition = "2021"
publish = false

[lib]
name = "xmark_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "~2.4"  # minor must match the npm package (pnpm holds new releases for a week)

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# Its own workspace: this crate is not part of the desktop build.
[workspace]
