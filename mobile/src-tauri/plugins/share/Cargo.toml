[package]
name = "tauri-plugin-xmark-share"
version = "0.1.0"
description = "Present the system share sheet for an exact original file (bytes/name/extension) on iOS."
edition = "2021"
publish = false
links = "tauri-plugin-xmark-share"
build = "build.rs"

[lib]
name = "tauri_plugin_xmark_share"
path = "src/lib.rs"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["wry"] }
thiserror = "2"
