<?xml version="1.0" encoding="UTF-8"?>
<!--
  XMark Mobile — iOS app icon source: the desktop M mark
  (src-tauri/icons/icon.svg) edge to edge on an opaque 1024 square with no
  squircle or gutter, because iOS applies its own mask (a transparent gutter
  shows up as a white frame on the home screen). The mark's 140-unit artboard
  maps onto the full canvas at 1024 / 140 = 7.314286.

  Palette (xmark-01-cyber-cyan): tile #060A13, columns #00E5FF, chevron #00FFA3.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#060A13"/>
  <g transform="scale(7.314286)">
    <rect x="30" y="36" width="18" height="70" rx="4" fill="#00E5FF"/>
    <rect x="92" y="36" width="18" height="70" rx="4" fill="#00E5FF"/>
    <polyline points="50,42 70,72 90,42" fill="none" stroke="#00FFA3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
