<?xml version="1.0" encoding="UTF-8"?>
<!--
  XMark — the mark as it is drawn at 16 and 32/48 points. Same geometry and
  palette as icon.svg; the only difference is a 16-unit chevron stroke instead of
  14, so the V still separates from the columns when the whole icon is a 24 px
  glyph. Rendered by scripts/build-app-icons.sh.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="#060A13"/>
  <g transform="translate(100 100) scale(5.885714)">
    <rect x="30" y="36" width="18" height="70" rx="4" fill="#00E5FF"/>
    <rect x="92" y="36" width="18" height="70" rx="4" fill="#00E5FF"/>
    <polyline points="50,42 70,72 90,42" fill="none" stroke="#00FFA3" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
